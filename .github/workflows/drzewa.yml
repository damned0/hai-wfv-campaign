name: HAI drzewa bez makro (ET/RF/HGB 3x10 + LGB 20, zdekorelowane)
# 2026-09-14: tools/drzewa_zdekorelowane.py po wycieciu makro tradfi (ml_trainer.MAKRO_USUNIETE).
# Podzial kalendarzowy z cieciem na sztywno (POSZ_CIECIE_STALE), zeby wyniki byly
# porownywalne z podem (dane tu koncza sie wczesniej niz na VPS).
on:
  workflow_dispatch:
    inputs:
      ciecie:
        description: "data ciecia trening/test"
        default: "2024-10-31 15:00:00"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        etykieta: ["2.5,1.5,24,L","2.5,1.5,24,S","2.5,1.5,48,L","2.5,1.5,48,S","2.5,1.5,72,L","2.5,1.5,72,S",
                   "4.0,1.0,24,L","4.0,1.0,24,S","4.0,1.0,48,L","4.0,1.0,48,S","4.0,1.0,72,L","4.0,1.0,72,S",
                   "6.0,1.5,24,L","6.0,1.5,24,S","6.0,1.5,48,L","6.0,1.5,48,S","6.0,1.5,72,L","6.0,1.5,72,S"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: shim /root/ProjektHAI
        run: |
          sudo mkdir -p /root && sudo chmod 755 /root
          sudo ln -sfn "$GITHUB_WORKSPACE" /root/ProjektHAI
      - name: cechy pochodne (jak kampania WFV)
        run: |
          python data_warehouse/licz_korelacje_btc.py
          python data_warehouse/licz_cechy_przekrojowe.py
          python data_warehouse/licz_cechy_cvd.py
      - name: drzewa
        env:
          HAI_ROOT: ${{ github.workspace }}
          HAI_INSTANCE_DIR: ${{ github.workspace }}
          HAI_N_PARALLEL: "4"
          DRZEWA_NJ: "4"
          POSZ_CIECIE_STALE: ${{ inputs.ciecie }}
        run: |
          mkdir -p wyniki
          E="${{ matrix.etykieta }}"; N=$(echo "$E" | tr ',' '_')
          python -u tools/drzewa_zdekorelowane.py --zbior wyniki/zbior.parquet --przygotowany wyniki/przyg.parquet \
            --wyniki wyniki/drzewa_$N.csv --tylko "$E"
          rm -f wyniki/zbior.parquet wyniki/przyg.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drzewa-${{ strategy.job-index }}
          path: wyniki/
          retention-days: 30
