name: HAI WFV campaign

on:
  workflow_dispatch:
    inputs:
      configs:
        description: "comma-separated FAM-* configs (empty = full matrix)"
        required: false
        default: ""
      confs:
        description: "comma-separated confidence levels"
        required: false
        default: "0.80,0.85,0.90,0.95"
      plans:
        description: "comma-separated windowsxdays, e.g. 1x365,6x90,12x45 (12x45 = oficjalny walidator od 2026-08-04)"
        required: false
        default: "1x365,6x90,12x45"
      threshold:
        description: "prog decyzji (backtester._DECISION_THRESHOLD). MUSI byc rowny HAI_DECISION_THRESHOLD w .env instancji"
        required: false
        default: "0.35"
      vote_gate:
        description: "prog glosu pojedynczego modelu (backtester._VOTE_GATE). MUSI byc rowny HAI_VOTE_GATE w .env instancji"
        required: false
        default: "0.40"
      anchor:
        description: "kotwica czasu okien RRRR-MM-DD (puste = teraz). Bez niej dwa przebiegi z roznych dni licza INNE okna."
        required: false
        default: ""
      threshold_sweep:
        description: "lista progow decyzji, np. 0.20,0.30,0.45 — trening RAZ, symulacja N razy; wyniki jako <config>@t<prog>"
        required: false
        default: ""
      meta_label:
        description: "1 = wlacz meta-labeling (META_LABEL_ENABLED). Puste = wylaczony, jak dotad we WSZYSTKICH 34 przebiegach"
        required: false
        default: ""
      meta_threshold:
        description: "prog meta-labelingu, domyslnie 0.60 jak w .env instancji"
        required: false
        default: "0.60"
      size_scale:
        description: "off = wylacz redukcje rozmiaru po stracie (SIZE_SCALE_BY_LOSSES). Puste = wlaczona (0.10)"
        required: false
        default: ""
      adx_min:
        description: "prog ADX (backtester._ADX_MIN). Puste = 22 (domyslne). Sweep: 14/18/22/26"
        required: false
        default: ""
      smoke:
        description: "smoke test only (single fastest combo)"
        type: boolean
        default: false

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          smoke = "${{ inputs.smoke }}" == "true"
          if smoke:
              combos = [{"cfg": "FAM-cat_sniper", "conf": "0.80", "w": "1", "wd": "365"}]
          else:
              cfgs_in = "${{ inputs.configs }}".strip()
              cfgs = [c.strip() for c in cfgs_in.split(",") if c.strip()] or [
                  "FAM-cat_sniper","FAM-cat_trend","FAM-cat_rev",
                  "FAM-lgb_sniper","FAM-lgb_trend","FAM-lgb_rev",
                  "FAM-xgb_sniper","FAM-xgb_trend","FAM-xgb_rev",
              ]
              confs = [c.strip() for c in "${{ inputs.confs }}".split(",") if c.strip()]
              plans = [p.strip() for p in "${{ inputs.plans }}".split(",") if p.strip()]
              combos = []
              for cfg in cfgs:
                  for conf in confs:
                      for plan in plans:
                          w, wd = plan.lower().split("x")
                          combos.append({"cfg": cfg, "conf": conf, "w": w, "wd": wd})
          print("matrix=" + json.dumps({"include": combos}))
          EOF

  run:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: shim /root/ProjektHAI (hai_common ma kilka zahardkodowanych sciezek)
        run: |
          sudo mkdir -p /root
          sudo chmod 755 /root
          sudo ln -sfn "$GITHUB_WORKSPACE" /root/ProjektHAI
          echo "shell find count: $(find /root/ProjektHAI/data_warehouse/ohlcv/binance/1h -name '*.parquet' | wc -l)"
          python3 -c "from pathlib import Path; p = Path('/root/ProjektHAI/data_warehouse/ohlcv/binance'); files = list((p/'1h').glob('*.parquet')); print('exists:', p.exists(), '| python glob count:', len(files), '| BTC:', (p/'1h'/'BTC.parquet').exists())"
      - name: policz cechy korelacji BTC-alt
        run: |
          # Cechy licza sie WYLACZNIE z OHLCV, ktore repo juz ma — wiec nie
          # wysylamy 216 MB gotowych parquetow, tylko generujemy je na miejscu.
          # Sciezki w skrypcie sa bezwzgledne (/root/ProjektHAI/...), a krok
          # "shim" wyzej tworzy tam dowiazanie do katalogu roboczego.
          python data_warehouse/licz_korelacje_btc.py
          ls data_warehouse/korelacje_btc/*.parquet | wc -l

      - name: policz cechy przekrojowe (zdarzenia + ranking rynku)
        run: |
          python data_warehouse/licz_cechy_przekrojowe.py
          ls data_warehouse/cechy_przekrojowe/*.parquet | wc -l

      - name: policz cechy CVD (order flow, z-score per symbol)
        run: |
          # Liczone na runnerze z data_warehouse/orderflow, ktory repo juz
          # wozi (93 MB, 128 symboli) — taniej niz wysylanie 55 MB gotowych
          # cech przy kazdej zmianie. Ten sam wzorzec co korelacje/przekrojowe.
          python data_warehouse/licz_cechy_cvd.py
          ls data_warehouse/cechy_cvd/*.parquet | wc -l

      - name: run WFV combo
        env:
          HAI_ROOT: ${{ github.workspace }}
          HAI_INSTANCE_DIR: ${{ github.workspace }}
        run: |
          # --threshold i --vote-gate dodane 2026-08-13. Wczesniej NIE byly
          # przekazywane, wiec GH liczyl na domyslnych hai_wfv (0.35/0.40)
          # niezaleznie od tego, czym jechala produkcja — werdykty opisywaly
          # inny uklad niz uruchomiony. Teraz musza byc rowne HAI_DECISION_THRESHOLD
          # i HAI_VOTE_GATE z .env instancji.
          # UWAGA: krok dziala z 'bash -e'. Konstrukcja [ -n "" ] && X zwraca 1
          # przy pustym wejsciu i ZABILABY caly krok — stad jawne if/fi.
          # HAI_ADX_MIN czytane przez backtester przy imporcie modulu
          if [ -n "${{ inputs.adx_min }}" ]; then export HAI_ADX_MIN="${{ inputs.adx_min }}"; fi
          if [ -n "${{ inputs.size_scale }}" ]; then export HAI_SIZE_SCALE="${{ inputs.size_scale }}"; fi
          # Meta-labeling: do 2026-08-30 workflow NIGDY go nie ustawial, wiec
          # wszystkie przebiegi szly BEZ niego, a produkcja handlowala Z NIM.
          # config.py czyta META_LABEL_ENABLED jako "true"/"false".
          if [ "${{ inputs.meta_label }}" = "1" ]; then
            export META_LABEL_ENABLED=true
            export META_LABEL_THRESHOLD="${{ inputs.meta_threshold }}"
          else
            export META_LABEL_ENABLED=false
          fi
          ARGS=""
          if [ -n "${{ inputs.anchor }}" ]; then ARGS="$ARGS --anchor ${{ inputs.anchor }}"; fi
          if [ -n "${{ inputs.threshold_sweep }}" ]; then ARGS="$ARGS --threshold-sweep ${{ inputs.threshold_sweep }}"; fi
          python hai_wfv.py --configs "${{ matrix.cfg }}" \
            --windows "${{ matrix.w }}" --window-days "${{ matrix.wd }}" \
            --embargo 7 --conf "${{ matrix.conf }}" \
            --threshold "${{ inputs.threshold }}" \
            --vote-gate "${{ inputs.vote_gate }}" $ARGS
      - name: upload db
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.cfg }}-c${{ matrix.conf }}-${{ matrix.w }}x${{ matrix.wd }}
          path: |
            HAI-NL/data/hairesearch.db
            *.log
          if-no-files-found: warn
